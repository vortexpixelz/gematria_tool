[project]
name = "gematria-tool"
version = "0.1.0"
description = "Calculate gematria/isopsephy values for Hebrew and Greek text."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gematria Tool Maintainers", email = "maintainers@example.com" }]
license = { text = "MIT" }
keywords = ["gematria", "isopsephy", "hebrew", "greek", "numerology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/example/gematria-tool"
Repository = "https://github.com/example/gematria-tool"

[project.scripts]
gematria-tool = "gematria_tool.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gematria_tool"]
